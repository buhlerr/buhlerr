name: Render README

on:
  push:
    branches: [main]
    paths:
      - "carreira.yaml"
      - "scripts/render.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/render.py carreira.yaml README.md readme
      - name: Commit se mudou
        run: |
          git config user.name "openbotgit[bot]"
          git config user.email "335604065+openbotgit[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "README regenerado do carreira.yaml [skip ci]" && git push)
